# ============================================================
# ノード/エッジ分離配置のサーバ定義 (multi/run_*.sh が読む)
# ------------------------------------------------------------
# 形式: 1行1台で "host id ip port role" の5カラム (空白区切り)。
#   host : ssh 接続先 (~/.ssh/config のエイリアスか FQDN)
#   id   : server-id。0 から連番で K-1 まで（欠番・重複不可）
#   ip   : サーバがバインドする IP
#   port : ポート
#   role : node | edge
#
# 並び順の規約（重要）:
#   role=node をすべて先 (id 0..Kn-1)、role=edge をすべて後 (id Kn..K-1)。
#   パーティショナが id < Kn をノード役とみなすため。
#   node 役・edge 役はそれぞれ1台以上必要。
#
# 台数を増やすとき:
#   1) 行を追加する（node 役なら node ブロックの末尾、edge 役なら最後尾）
#   2) id を 0 から振り直す
#   3) 分割を作り直して各ホストへ配置する
# ============================================================

# host   id   ip            port   role
ab06     0    10.58.60.6    3000   node
ab11     1    10.58.60.11   3000   edge

# --- 例: Kn=2, Ke=3 の 5台構成（コメントを外して編集）---
# ab06   0    10.58.60.6    3000   node
# ab07   1    10.58.60.7    3000   node
# ab11   2    10.58.60.11   3000   edge
# ab12   3    10.58.60.12   3000   edge
# ab13   4    10.58.60.13   3000   edge
