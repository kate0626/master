# ============================================================
# 分散RW実験のサーバ定義 (splits_reuse_score.sh が読み込む)
# ------------------------------------------------------------
# 形式: 1行1台で "host id ip port" の4カラム (空白区切り)。
#   host : ssh 接続先ホスト名 (~/.ssh/config のエイリアスか FQDN)
#   id   : server-id。必ず 0 から連番で K-1 まで。node_to_starts_server<id>.json と対応。
#   ip   : サーバがバインドする IP (エンドポイントに使う)
#   port : ポート
# 空行と '#' 始まりのコメント行は無視される。
#
# 台数を増やすとき:
#   1) この下に行を追加する (id は 0,1,2,... の連番)。
#   2) 事前に partition_metis.sh --graph <G> --server-count <台数> で
#      node_to_starts_server{0..K-1}.json を生成し、各ホストへ配置しておく。
#   3) splits_reuse_score.sh を実行 (--servers / --server-endpoints は自動生成される)。
#
# 別ファイルを使う場合:  SERVERS_CONF=/path/to/other.conf zsh splits_reuse_score.sh
# ============================================================

# host   id   ip            port
ab06     0    10.58.60.6    3000
ab11     1    10.58.60.11   3000

# --- K台に増やす例 (コメントを外して編集) ---
# ab12   2    10.58.60.12   3000
# ab13   3    10.58.60.13   3000
